<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FarmCare AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --moss-dark:#1F3328;
    --moss:#3C5C46;
    --moss-soft:#5C7A63;
    --sand:#EFE4CB;
    --surface:#FBF7EC;
    --surface-2:#F4EBD6;
    --ink:#23281F;
    --ink-soft:#5B6055;
    --gold:#C99A3B;
    --sky:#5F8CA0;
    --barn:#A8432F;
    --barn-soft:#F1DCD3;
    --ok:#4C7A3D;
    --ok-soft:#E1EBD9;
    --warn:#C99A3B;
    --warn-soft:#F5E8CC;
    --high:#C06A2C;
    --high-soft:#F4DFCB;
    --emg:#A8432F;
    --emg-soft:#F1DCD3;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow:0 2px 0 rgba(31,51,40,0.06), 0 8px 20px -10px rgba(31,51,40,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Tamil','Noto Sans',-apple-system,sans-serif;
    background:var(--sand);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--sand);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .screen{
    flex:1;
    padding:20px 18px 100px 18px;
    overflow-y:auto;
  }
  .screen.no-nav{padding-bottom:24px;}

  /* Bilingual label helper */
  .bi{display:inline-flex;flex-direction:column;line-height:1.15;}
  .bi .en{font-weight:700;}
  .bi .ta{font-weight:500;color:inherit;opacity:0.86;font-size:0.86em;}
  .bi.inline{flex-direction:row;gap:6px;align-items:baseline;}
  .bi.inline .ta{opacity:0.7;}

  h1,h2,h3{margin:0;font-family:'Noto Sans Tamil','Noto Sans',sans-serif;}

  /* Login screen */
  .login-wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:32px 26px;
    background:
      radial-gradient(circle at 15% -10%, #4a6d54 0%, transparent 45%),
      linear-gradient(180deg, var(--moss-dark) 0%, var(--moss) 62%, var(--sand) 62%);
  }
  .logo-row{font-size:44px;letter-spacing:2px;margin-bottom:6px;}
  .app-logo-badge{width:112px;height:112px;margin:0 auto 10px auto;display:block;border-radius:26px;object-fit:cover;box-shadow:0 8px 20px -6px rgba(0,0,0,0.45);border:3px solid #C99A3B;}
  .brand-title{color:#fff;font-size:28px;font-weight:800;margin-bottom:2px;}
  .brand-sub .en{color:#fff;font-size:16px;}
  .brand-sub .ta{color:#DCE8DD;font-size:14px;}
  .login-card{
    margin-top:34px;
    background:var(--surface);
    border-radius:var(--radius-lg);
    padding:22px 20px;
    box-shadow:var(--shadow);
  }
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field input{
    width:100%;
    padding:14px 14px;
    border-radius:var(--radius-sm);
    border:1.5px solid #E1D6B8;
    background:#fff;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--moss);border-color:var(--moss);}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;
    padding:15px 16px;
    border-radius:var(--radius-md);
    border:none;
    font-size:16px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    text-align:center;
  }
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .btn-primary{background:var(--moss-dark);color:#fff;}
  .btn-primary:active{background:var(--moss);}
  .btn-ghost{background:transparent;color:var(--moss-dark);border:1.5px solid var(--moss-dark);}
  .btn-gold{background:var(--gold);color:var(--moss-dark);}
  .btn-emg{background:var(--emg);color:#fff;}
  .btn-sm{padding:10px 14px;font-size:14px;border-radius:var(--radius-sm);}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .lang-toggle{
    display:flex;justify-content:center;gap:0;margin-top:22px;
    background:rgba(255,255,255,0.15);border-radius:999px;padding:4px;width:fit-content;margin-left:auto;margin-right:auto;
  }
  .lang-toggle button{
    border:none;background:transparent;padding:8px 16px;border-radius:999px;font-weight:700;font-family:inherit;font-size:14px;color:#fff;cursor:pointer;
  }
  .lang-toggle button.active{background:#fff;color:var(--moss-dark);}

  /* Splash spinner */
  .spinner{
    width:52px;height:52px;
    margin:30px auto 0 auto;
    border-radius:50%;
    border:5px solid rgba(255,255,255,0.28);
    border-top-color:var(--gold);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* App-wide single-language display modes (set on #app) */
  #app.lang-en-only .ta{display:none;}
  #app.lang-ta-only .en{display:none;}

  /* Top bar */
  .topbar{
    display:flex;align-items:center;gap:12px;margin-bottom:18px;
  }
  .topbar .back{
    width:38px;height:38px;border-radius:50%;background:var(--surface);border:none;
    display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:var(--shadow);
    flex-shrink:0;
  }
  .topbar h1{font-size:20px;}
  .topbar h1 .ta{display:block;font-size:13px;color:var(--ink-soft);font-weight:500;}

  .greet{margin-bottom:18px;}
  .greet .en{font-size:22px;font-weight:800;}
  .greet .ta{font-size:14px;color:var(--ink-soft);}

  /* Animal cards */
  .animal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
  .animal-card{
    background:var(--surface);border-radius:var(--radius-md);padding:12px 6px;text-align:center;
    border:none;cursor:pointer;box-shadow:var(--shadow);
  }
  .animal-card .ic{font-size:26px;display:block;margin-bottom:4px;}
  .animal-card .en{font-size:11.5px;font-weight:700;display:block;}
  .animal-card .ta{font-size:10.5px;color:var(--ink-soft);display:block;}
  .animal-card.selected{outline:2.5px solid var(--moss-dark);}

  /* Feature tiles */
  .tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tile{
    background:var(--surface);border-radius:var(--radius-lg);padding:16px 12px;
    border:none;cursor:pointer;box-shadow:var(--shadow);text-align:left;
    display:flex;flex-direction:column;gap:10px;min-height:104px;
  }
  .tile .ic{font-size:26px;}
  .tile .en{font-size:14px;font-weight:700;line-height:1.2;}
  .tile .ta{font-size:12px;color:var(--ink-soft);line-height:1.2;}
  .tile.accent-gold{background:linear-gradient(160deg,#FBF3DD,var(--surface));}
  .tile.accent-sky{background:linear-gradient(160deg,#E4EEF1,var(--surface));}
  .tile.accent-barn{background:linear-gradient(160deg,var(--barn-soft),var(--surface));}
  .tile.wide{grid-column:1 / -1;flex-direction:row;align-items:center;}

  /* card generic */
  .card{
    background:var(--surface);border-radius:var(--radius-lg);padding:18px 16px;box-shadow:var(--shadow);margin-bottom:16px;
  }
  .section-title{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:baseline;gap:6px;}
  .section-title .ta{font-size:12px;font-weight:500;color:var(--ink-soft);}

  textarea{
    width:100%;min-height:90px;padding:12px;border-radius:var(--radius-sm);border:1.5px solid #E1D6B8;
    font-family:inherit;font-size:15px;resize:vertical;background:#fff;color:var(--ink);
  }
  select, input[type=text], input[type=number], input[type=date]{
    width:100%;padding:12px;border-radius:var(--radius-sm);border:1.5px solid #E1D6B8;
    font-family:inherit;font-size:15px;background:#fff;color:var(--ink);
  }
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .photo-drop{
    border:2px dashed #C9BB94;border-radius:var(--radius-md);padding:22px 10px;text-align:center;color:var(--ink-soft);
    background:#fff;cursor:pointer;
  }
  .photo-preview{width:100%;border-radius:var(--radius-md);max-height:220px;object-fit:cover;display:block;margin-bottom:10px;}

  .mic-btn{
    width:150px;height:150px;border-radius:50%;background:var(--moss-dark);border:none;color:#fff;
    font-size:52px;display:flex;align-items:center;justify-content:center;margin:24px auto 14px auto;cursor:pointer;
    box-shadow:0 10px 26px -8px rgba(31,51,40,0.55);
  }
  .mic-btn.listening{background:var(--barn);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(168,67,47,0.45);}70%{box-shadow:0 0 0 22px rgba(168,67,47,0);}100%{box-shadow:0 0 0 0 rgba(168,67,47,0);}}

  .chip{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;}
  .chip.low{background:var(--ok-soft);color:var(--ok);}
  .chip.moderate{background:var(--warn-soft);color:#8a6a1f;}
  .chip.high{background:var(--high-soft);color:var(--high);}
  .chip.emergency{background:var(--emg-soft);color:var(--emg);}

  .list-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--surface);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);
    cursor:pointer;border:none;width:100%;text-align:left;
  }
  .list-item .meta{font-size:12px;color:var(--ink-soft);}
  .list-item.topic-active{outline:2.5px solid var(--moss-dark);background:var(--surface-2);}
  .status-badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;}
  .status-badge.completed{background:var(--ok-soft);color:var(--ok);}
  .status-badge.due{background:var(--warn-soft);color:#8a6a1f;}
  .status-badge.overdue{background:var(--emg-soft);color:var(--emg);}

  .warn-box{
    background:var(--barn-soft);border-left:4px solid var(--barn);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:14px;
  }
  .info-box{
    background:#E4EEF1;border-left:4px solid var(--sky);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:14px;
  }
  .demo-box{
    background:#F2ECD9;border:1px dashed #C9BB94;border-radius:12px;padding:10px 12px;font-size:12px;color:var(--ink-soft);margin-bottom:14px;
  }
  ul.bullets{margin:0;padding-left:18px;}
  ul.bullets li{margin-bottom:6px;font-size:14px;line-height:1.4;}

  /* bottom nav */
  .bottom-nav{
    position:sticky;bottom:0;left:0;right:0;
    background:var(--surface);
    border-top:1px solid #E5D9B8;
    display:flex;
    padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 6px) 4px;
    box-shadow:0 -6px 16px -10px rgba(31,51,40,0.3);
  }
  .nav-btn{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 2px;cursor:pointer;color:var(--ink-soft);border-radius:12px;
  }
  .nav-btn .ic{font-size:21px;}
  .nav-btn .lab{font-size:9.5px;font-weight:700;}
  .nav-btn .lab .ta{font-size:9px;display:block;}
  .nav-btn.active{color:var(--moss-dark);background:var(--surface-2);}

  .fab-emergency{
    position:fixed;
    max-width:460px;
    width:100%;
    display:flex;
    justify-content:flex-end;
    pointer-events:none;
  }

  .link-btn{background:none;border:none;color:var(--moss-dark);font-weight:700;font-family:inherit;font-size:13px;cursor:pointer;padding:4px;text-decoration:underline;}
  .divider{height:1px;background:#E5D9B8;margin:14px 0;}
  .small-muted{font-size:12px;color:var(--ink-soft);}
  .grow{flex:1;}
  .center{text-align:center;}
  .avatar-photo{width:56px;height:56px;border-radius:14px;object-fit:cover;background:#E5D9B8;flex-shrink:0;}
</style>
</head>

  const ANIMAL_TYPES = [
    {id:'cow', ic:'🐄', en:'Cow', ta:'மாடு'},
    {id:'goat', ic:'🐐', en:'Goat', ta:'ஆடு'},
    {id:'sheep', ic:'🐑', en:'Sheep', ta:'செம்மறியாடு'},
    {id:'hen', ic:'🐔', en:'Hen', ta:'கோழி'},
  ];

  const DEMO_CREDENTIALS = { mobile: '9876543210', otp: '1234' };

  function animalMeta(id){ return ANIMAL_TYPES.find(a=>a.id===id) || ANIMAL_TYPES[0]; }

  /* ---------------- Storage helpers ---------------- */
  async function loadAnimals(){
    try{
      const listing = await window.storage.list('animal:');
      const keys = (listing && listing.keys) || [];
      const animals = [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k);
          if(r && r.value) animals.push(JSON.parse(r.value));
        }catch(e){}
      }
      animals.sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));
      state.animals = animals;
    }catch(e){ console.error('load animals failed', e); }
  }
  async function saveAnimal(animal){
    try{
      await window.storage.set('animal:'+animal.id, JSON.stringify(animal));
    }catch(e){ console.error('save failed', e); }
  }
  async function deleteAnimal(id){
    try{ await window.storage.delete('animal:'+id); }catch(e){}
    state.animals = state.animals.filter(a=>a.id!==id);
    render();
  }
  function getAnimal(id){ return state.animals.find(a=>a.id===id); }

  function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
  function vaccStatus(nextDue){
    if(!nextDue) return 'due';
    const d = daysBetween(todayISO(), nextDue);
    if(d < 0) return 'overdue';
    if(d <= 14) return 'due';
    return 'completed'; // far away = on schedule; treat as "completed/scheduled"
  }
  function fmtDate(d){
    if(!d) return '—';
    try{ return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; }
  }

  /* ---------------- Navigation ---------------- */
  function go(page, extra){
    state.prevPage = state.page;
    state.page = page;
    if(extra) Object.assign(state, extra);
    render();
    const scr = document.querySelector('.screen');
    if(scr) scr.scrollTop = 0;
  }

  /* ---------------- Bilingual helper ---------------- */
  function bi(en, ta, inline){
    return `<span class="bi${inline?' inline':''}"><span class="en">${en}</span><span class="ta">${ta}</span></span>`;
  }

  /* ---------------- Speech helpers ---------------- */
  function speechLangCode(){ return state.lang === 'en' ? 'en-IN' : 'ta-IN'; }
  function speak(text, lang){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang || 'ta-IN';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }catch(e){ console.error(e); }
  }
  function getRecognition(lang){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return null;

  function analyzeScan(){
    const text = (state.scan.symptomsText||'').toLowerCase();
    const matched = SYMPTOM_KEYWORDS.filter(s=>s.keys.some(k=>text.includes(k.toLowerCase())));
    const hasPhoto = !!state.scan.photoData;
    let risk = 'low';
    const emergencyHit = matched.some(m=>['bleeding','possible fever','coughing or breathing difficulty'].includes(m.en)) && matched.length>=2;
    if(matched.some(m=>m.en==='bleeding')) risk='emergency';
    else if(matched.length>=3) risk='high';
    else if(matched.length>=1) risk='moderate';
    else risk='low';

    const visible = hasPhoto
      ? {en:'A photo was provided. General posture and visible body condition can be reviewed, but skin, coat and eye details should be checked closely by a veterinarian in person — this cannot confirm a diagnosis from the image alone.',
         ta:'புகைப்படம் வழங்கப்பட்டுள்ளது. உடல் நிலை பொதுவாக பார்க்கப்படலாம், ஆனால் தோல், ரோமம், கண் விவரங்களை கால்நடை மருத்துவர் நேரில் பரிசோதிக்க வேண்டும். படத்தால் மட்டும் உறுதியான நோய் கண்டறிய முடியாது.'}
      : {en:'No photo was provided, so no visible signs could be assessed from an image.', ta:'புகைப்படம் வழங்கப்படவில்லை, எனவே படத்தின் மூலம் தெரியக்கூடிய அறிகுறிகள் மதிப்பீடு செய்யப்படவில்லை.'};

    const reported = matched.length
      ? matched.map(m=>({en:m.en, ta:m.ta}))
      : [{en:'No specific symptoms were recognised from what was typed or spoken. Try describing what the animal is doing differently.', ta:'குறிப்பிட்ட அறிகுறிகள் இனங்காணப்படவில்லை. விலங்கு என்ன மாறுபட்டு நடந்துகொள்கிறது என விவரிக்கவும்.'}];

    const causesMap = {
      cow:{en:['Infectious illness (e.g. viral or bacterial infection)','Digestive upset','Heat stress or environmental factors','Mastitis (if milk drop reported)'],
           ta:['தொற்று நோய் (வைரஸ் / பாக்டீரியா)','செரிமான கோளாறு','வெப்ப அழுத்தம்','பால் குறைவு இருந்தால் மேஸ்டைடிஸ் இருக்கலாம்']},
      goat:{en:['Parasitic infection','Digestive upset','Respiratory infection','Nutritional deficiency'],
            ta:['ஒட்டுண்ணி தொற்று','செரிமான கோளாறு','சுவாச தொற்று','ஊட்டச்சத்து குறைபாடு']},
      sheep:{en:['Parasitic infection','Foot rot (if lameness reported)','Respiratory infection','Nutritional deficiency'],
             ta:['ஒட்டுண்ணி தொற்று','கால் அழுகல் (நொண்டி இருந்தால்)','சுவாச தொற்று','ஊட்டச்சத்து குறைபாடு']},
      hen:{en:['Viral or bacterial infection','Parasites (mites/worms)','Nutritional deficiency','Heat stress (if egg drop reported)'],
           ta:['வைரஸ் / பாக்டீரியா தொற்று','ஒட்டுண்ணிகள்','ஊட்டச்சத்து குறைபாடு','முட்டை குறைவு இருந்தால் வெப்ப அழுத்தம்']},
    };
    const causes = causesMap[state.scan.animalType] || causesMap.cow;

    return {
      animal: state.scan.animalType,
      visible, reported, causes, risk,
      photoData: state.scan.photoData,
      symptomsText: state.scan.symptomsText,
    };
  }

    goat:[
      {id:'fever', ic:'🌡️', en:'Fever / Infection', ta:'காய்ச்சல் / தொற்று',
        en_steps:['Move to a clean, shaded, well-ventilated area.','Provide clean drinking water.','Isolate from the flock if infection is suspected.','Contact a veterinarian if fever persists more than a day.'],
        ta_steps:['சுத்தமான, நிழலான, காற்றோட்டமான இடத்திற்கு நகர்த்தவும்.','சுத்தமான குடிநீர் கொடுக்கவும்.','தொற்று சந்தேகம் இருந்தால் மற்றவைகளிலிருந்து பிரிக்கவும்.','காய்ச்சல் ஒரு நாளுக்கு மேல் நீடித்தால் மருத்துவரை தொடர்பு கொள்ளவும்.']},
      {id:'snakebite', ic:'🐍', en:'Snake Bite', ta:'பாம்பு கடி',
        en_steps:['Keep the goat calm and still — restrict movement.','Do not cut, suck or apply ice/chemicals to the bite.','Note the bite site and time.','Emergency — transport to a veterinarian immediately.'],
        ta_steps:['ஆட்டை அமைதியாக, அசையாமல் வைக்கவும்.','கடி இடத்தை வெட்டவோ, உறிஞ்சவோ, பனிக்கட்டி/ரசாயனம் தடவவோ கூடாது.','கடி இடம் மற்றும் நேரத்தை குறிக்கவும்.','அவசரநிலை — உடனே மருத்துவரிடம் அழைத்துச் செல்லவும்.']},
      {id:'pregnancy', ic:'🤰', en:'Pregnancy Care', ta:'கருவுற்ற காலம் பராமரிப்பு',
        en_steps:['Increase nutritious feed in the last month of pregnancy.','Ensure clean water and shelter from extreme weather.','Prepare a clean, quiet kidding area.','If labor is prolonged without progress, contact a veterinarian immediately.'],
        ta_steps:['கடைசி மாதத்தில் சத்தான தீவனத்தை அதிகரிக்கவும்.','சுத்தமான தண்ணீர் மற்றும் கடும் வானிலையிலிருந்து பாதுகாப்பு வழங்கவும்.','ஈனும் இடத்தை சுத்தமாக, அமைதியாக வைக்கவும்.','பிரசவம் தாமதமாகி முன்னேற்றம் இல்லை என்றால் உடனே மருத்துவரை தொடர்பு கொள்ளவும்.']},
      {id:'bloat', ic:'🎈', en:'Bloat / Stomach Upset', ta:'வயிறு உப்புசம்',
        en_steps:['Stop feeding immediately, especially wet fodder or excess grain.','Check for a swollen left side of the belly.','Keep the goat gently moving; avoid letting it lie flat if bloated.','Emergency if breathing is difficult — contact a veterinarian immediately.'],
        ta_steps:['உடனே தீவனம் கொடுப்பதை நிறுத்தவும், குறிப்பாக ஈரமான தீவனம்/அதிக தானியம்.','இடது பக்க வயிறு உப்புசமாக இருக்கிறதா என சரிபார்க்கவும்.','மென்மையாக நடக்க வைக்கவும்; படுக்க வைக்க வேண்டாம்.','மூச்சு சிரமம் இருந்தால் அவசரநிலை — உடனே மருத்துவரை தொடர்பு கொள்ளவும்.']},
      {id:'wound', ic:'🩹', en:'Wound / Injury', ta:'காயம் / புண்',
        en_steps:['Clean superficial wounds gently with clean water.','Keep flies away; cover if possible.','Do not use home substances like ash or kerosene.','Deep wounds or heavy bleeding need immediate veterinary attention.'],
        ta_steps:['மேலோட்டமான காயங்களை சுத்தமான தண்ணீரால் சுத்தம் செய்யவும்.','ஈக்களை விரட்டவும்; முடிந்தால் மூடவும்.','சாம்பல்/மண்ணெண்ணெய் பயன்படுத்த வேண்டாம்.','ஆழமான காயம்/ரத்தப்போக்கு இருந்தால் உடனே மருத்துவரை அணுகவும்.']},
      {id:'heat', ic:'☀️', en:'Heat Stress', ta:'வெப்ப அழுத்தம்',
        en_steps:['Move to shade and provide cool water immediately.','Avoid grazing during peak heat hours.','Contact a veterinarian if the goat does not recover quickly.'],
        ta_steps:['உடனே நிழலுக்கு நகர்த்தி குளிர்ந்த தண்ணீர் கொடுக்கவும்.','அதிக வெயில் நேரத்தில் மேய்ச்சலை தவிர்க்கவும்.','விரைவாக மீளவில்லை என்றால் மருத்துவரை தொடர்பு கொள்ளவும்.']},
      {id:'diarrhea', ic:'💧', en:'Diarrhea', ta:'வயிற்றுப்போக்கு',
        en_steps:['Provide continuous clean water.','Remove spoiled feed; check for sudden feed changes.','Isolate from the flock.','Contact a veterinarian if it continues more than a day, especially in kids (young goats).'],
        ta_steps:['தொடர்ந்து சுத்தமான தண்ணீர் கொடுக்கவும்.','கெட்ட தீவனத்தை நீக்கவும்; திடீர் தீவன மாற்றத்தை சரிபார்க்கவும்.','மற்றவைகளிலிருந்து பிரிக்கவும்.','குட்டிகளுக்கு ஒரு நாளுக்கு மேல் தொடர்ந்தால் மருத்துவரை தொடர்பு கொள்ளவும்.']},
    ],

      {id:'heat', ic:'☀️', en:'Heat Stress', ta:'வெப்ப அழுத்தம்',

    hen:[
      {id:'fever', ic:'🌡️', en:'General Sickness', ta:'பொது உடல்நலக் குறைவு',
        en_steps:['Isolate the sick bird from the flock immediately.','Keep it warm, calm and in a clean, dry space.','Provide clean water; add electrolytes/glucose water if the bird is weak.','Contact a veterinarian if several birds are affected — this can spread fast.'],
        ta_steps:['நோய்வாய்ப்பட்ட கோழியை உடனே பிரிக்கவும்.','சூடாக, அமைதியாக, சுத்தமான, உலர்ந்த இடத்தில் வைக்கவும்.','சுத்தமான தண்ணீர் கொடுக்கவும்; பலவீனமாக இருந்தால் எலக்ட்ரோலைட்/குளுக்கோஸ் தண்ணீர் கொடுக்கலாம்.','பல கோழிகள் பாதிக்கப்பட்டால் உடனே மருத்துவரை தொடர்பு கொள்ளவும் — இது வேகமாக பரவும்.']},
      {id:'snakebite', ic:'🐍', en:'Snake / Predator Bite', ta:'பாம்பு / விலங்கு கடி',
        en_steps:['Keep the bird calm and still in a covered box.','Do not apply ice or home chemicals to the wound.','Check for bleeding and cover gently with a clean cloth if needed.','Contact a veterinarian promptly, especially if the bird is very weak.'],
        ta_steps:['கோழியை மூடிய பெட்டியில் அமைதியாக வைக்கவும்.','காயத்தில் பனிக்கட்டி/வீட்டு ரசாயனம் தடவ வேண்டாம்.','ரத்தப்போக்கு இருந்தால் சுத்தமான துணியால் மூடவும்.','கோழி பலவீனமாக இருந்தால் உடனே மருத்துவரை தொடர்பு கொள்ளவும்.']},
      {id:'eggbind', ic:'🥚', en:'Egg Binding / Laying Trouble', ta:'முட்டை சிக்குதல்',
        en_steps:['Keep the hen warm and calm in a quiet, dim space.','Offer calcium-rich feed or a calcium supplement.','Do not try to pull an egg out forcefully.','Contact a veterinarian if the hen strains without laying for over a day.'],
        ta_steps:['கோழியை அமைதியான, குறைந்த வெளிச்ச இடத்தில் சூடாக வைக்கவும்.','கால்சியம் நிறைந்த தீவனம் அல்லது சப்ளிமெண்ட் கொடுக்கவும்.','முட்டையை பலமாக இழுத்து எடுக்க வேண்டாம்.','ஒரு நாளுக்கு மேல் முயற்சி செய்தும் முட்டை வராவிட்டால் மருத்துவரை தொடர்பு கொள்ளவும்.']},
      {id:'crop', ic:'🎈', en:'Crop Impaction / Stomach Upset', ta:'வயிறு அடைப்பு / வயிற்று கோளாறு',
        en_steps:['Feel the crop (lower neck) — if hard and full even after fasting hours, it may be impacted.','Stop feeding and offer only water for a few hours.','Do not force fluids into the beak.','Contact a veterinarian if the crop stays hard and full.'],
        ta_steps:['கழுத்தின் கீழ் பகுதியை (crop) தொட்டு பாருங்கள் — நீண்ட நேரம் உணவு இல்லாமலும் இறுக்கமாக இருந்தால் அடைப்பு இருக்கலாம்.','தீவனத்தை நிறுத்தி சிறிது நேரம் தண்ணீர் மட்டும் கொடுக்கவும்.','வலுக்கட்டாயமாக வாய் வழியாக திரவம் ஊற்ற வேண்டாம்.','இறுக்கம் தொடர்ந்தால் மருத்துவரை தொடர்பு கொள்ளவும்.']},
      {id:'wound', ic:'🩹', en:'Wound / Injury', ta:'காயம் / புண்',
        en_steps:['Clean small wounds gently with clean water.','Keep the bird separated so others do not peck at the wound.','Avoid home substances on the wound.','Contact a veterinarian for deep wounds or heavy bleeding.'],
        ta_steps:['சிறிய காயங்களை சுத்தமான தண்ணீரால் சுத்தம் செய்யவும்.','மற்ற கோழிகள் கொட்டாமல் தனியாக வைக்கவும்.','வீட்டு பொருட்களை தடவ வேண்டாம்.','ஆழமான காயத்திற்கு மருத்துவரை அணுகவும்.']},
      {id:'heat', ic:'☀️', en:'Heat Stress', ta:'வெப்ப அழுத்தம்',
        en_steps:['Ensure good ventilation and shade in the coop.','Provide extra cool water; add electrolytes in very hot weather.','Reduce overcrowding in the coop.','Contact a veterinarian if birds are panting heavily or collapsing.'],
        ta_steps:['கூட்டில் நல்ல காற்றோட்டம் மற்றும் நிழல் இருக்கச் செய்யவும்.','அதிக குளிர்ந்த தண்ணீர் கொடுக்கவும்; வெப்பம் அதிகமாக இருந்தால் எலக்ட்ரோலைட் சேர்க்கவும்.','கூட்டில் அதிக நெருக்கடியை குறைக்கவும்.','அதிக மூச்சிரைப்பு அல்லது சரிவு இருந்தால் மருத்துவரை தொடர்பு கொள்ளவும்.']},

  function ruleBasedVoiceReply(text){
    const t = (text||'').toLowerCase();
    const matched = SYMPTOM_KEYWORDS.filter(s=>s.keys.some(k=>t.includes(k.toLowerCase())));
    if(matched.length===0){
      return {
        en:"I couldn't understand a clear symptom. Please describe what the animal is doing differently — for example, not eating, coughing, or limping.",
        ta:"தெளிவான அறிகுறி புரியவில்லை. விலங்கு எப்படி மாறுபட்டு நடந்துகொள்கிறது எனச் சொல்லுங்கள் — உதாரணம்: சாப்பிடவில்லை, இருமல், நொண்டி."
      };
    }
    const hasFever = matched.some(m=>m.en==='possible fever');
    const hasBleeding = matched.some(m=>m.en==='bleeding');
    if(hasBleeding){
      return {
        en:"This sounds serious. Keep the animal calm and still, do not give any medicine, and contact a veterinarian immediately.",
        ta:"இது தீவிரமாக இருக்கலாம். விலங்கை அமைதியாக வைக்கவும், மருந்து கொடுக்க வேண்டாம், உடனடியாக கால்நடை மருத்துவரை தொடர்பு கொள்ளுங்கள்."
      };
    }
    if(hasFever){
      return {
        en:"Measure the animal's body temperature if you can. Give clean water and keep it in a shaded place. Do not give medicine without a veterinarian's advice. If the fever continues, contact a veterinarian right away.",
        ta:"மாட்டின் உடல் வெப்பநிலையை சரியாக அளவிடுங்கள். சுத்தமான தண்ணீர் கொடுத்து நிழலான இடத்தில் வைக்கவும். மருத்துவர் ஆலோசனை இல்லாமல் மருந்து கொடுக்க வேண்டாம். காய்ச்சல் தொடர்ந்தால் உடனடியாக கால்நடை மருத்துவரை அணுகுங்கள்."
      };
    }
    return {
      en:"Keep the animal in a clean, shaded space with fresh water, and watch it closely for the next day. If it does not improve, or gets worse, please contact a veterinarian.",
      ta:"விலங்கை சுத்தமான, நிழலான இடத்தில் சுத்தமான தண்ணீருடன் வைத்து, அடுத்த நாள் கவனமாக கவனிக்கவும். மேம்படவில்லை அல்லது மோசமானால், கால்நடை மருத்துவரை தொடர்பு கொள்ளுங்கள்."
    };
  }

      case 'login': html = renderLogin(); break;
      case 'home': html = renderHome(); break;
      case 'scan': html = renderScan(); break;
      case 'scanResult': html = renderScanResult(); break;
      case 'firstAid': html = renderFirstAid(); break;
      case 'firstAidLibrary': html = renderFirstAidLibrary(); break;
      case 'medicine': html = renderMedicine(); break;
      case 'vetFinder': html = renderVetFinder(); break;
      case 'liveLocation': html = renderLiveLocation(); break;
      case 'emergency': html = renderEmergency(); break;
      case 'vaccination': html = renderVaccinationHub(); break;
      case 'vaccinationAnimal': html = renderVaccinationAnimal(); break;
      case 'vaccinationGuide': html = renderVaccinationGuide(); break;
      case 'records': html = renderRecordsList(); break;
      case 'recordDetail': html = renderRecordDetail(); break;
      case 'recordAdd': html = renderRecordAdd(); break;
      case 'feed': html = renderFeed(); break;
      case 'reminders': html = renderReminders(); break;
      case 'voiceAI': html = renderVoiceAI(); break;
      case 'settings': html = renderSettings(); break;
      default: html = renderHome();
    }
    app.innerHTML = html;
    app.className = state.lang === 'en' ? 'lang-en-only' : (state.lang === 'ta' ? 'lang-ta-only' : '');
    attachHandlers();
  }

  function riskChip(risk){
    const labels = {low:{en:'Low',ta:'குறைவு',ic:'🟢'}, moderate:{en:'Moderate',ta:'மிதமான',ic:'🟡'}, high:{en:'High',ta:'அதிக',ic:'🟠'}, emergency:{en:'Emergency',ta:'அவசரம்',ic:'🔴'}};
    const l = labels[risk];
    return `<span class="chip ${risk}">${l.ic} ${l.en} / ${l.ta}</span>`;
  }

      tips_ta:['நாளொன்றுக்கு இரு முறை — காலை, மாலை தீவனம் கொடுக்கவும்; குளிர்ந்த நேரத்தில் அதிகம் உண்ணும்.','தண்ணீர் பாத்திரத்தை தினமும் சுத்தம் செய்யவும்; அழுக்கு தண்ணீர் நோயை வேகமாக பரப்பும்.','தீவனத்தை உலர்ந்த இடத்தில் சேமிக்கவும் — பூசணம் ஏறிய தீவனம் திடீர் இறப்புக்கு பொதுவான காரணம்.','10 கோழிகளுக்கு ஒரு நாளைக்கு ஏறத்தாழ 1.2 கிலோ தீவனம், 2.5 லிட்டர் தண்ணீர் தேவை.'],
    },
  };

  function renderFeed(){
    const g = FEED_GUIDE[state.animalTypeFilter] || FEED_GUIDE.cow;
    const am = animalMeta(state.animalTypeFilter);
    return `
    <div class="screen">
      ${topBar('Feed Management','தீவன மேலாண்மை')}
      ${renderAnimalTypePicker(state.animalTypeFilter, 'setFeedAnimal')}

      <div class="card" style="background:var(--surface-2);">
        <div class="section-title">${am.ic} ${bi('Daily Ration','தினசரி தீவன அளவு')}</div>
        <div class="small-muted">${bi(g.weight_en, g.weight_ta)}</div>
      </div>

      ${g.rows.map(r=>`
        <div class="card">
          <div class="section-title">${r.ic} ${bi(r.en, r.ta)}</div>
          <div style="background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-bottom:10px;">
            <div style="font-weight:800;font-size:15px;">${r.qty_en}</div>
            <div class="small-muted" style="font-weight:600;">${r.qty_ta}</div>
          </div>
          <p style="font-size:13.5px;margin:0;">${r.note_en}</p>
          <p style="font-size:12.5px;color:var(--ink-soft);margin:6px 0 0 0;">${r.note_ta}</p>
        </div>`).join('')}

      <div class="card">
        <div class="section-title">💡 ${bi('Feeding Tips','தீவன குறிப்புகள்')}</div>
        <div style="font-size:12.5px;font-weight:800;color:var(--ink-soft);margin-bottom:6px;">English</div>
        <ul class="bullets">${g.tips_en.map(x=>`<li>${x}</li>`).join('')}</ul>
        <div class="divider"></div>
        <div style="font-size:12.5px;font-weight:800;color:var(--ink-soft);margin-bottom:6px;">தமிழ்</div>
        <ul class="bullets">${g.tips_ta.map(x=>`<li>${x}</li>`).join('')}</ul>
      </div>

      <div class="info-box">${bi('These are general daily quantities for an average healthy adult animal. Actual amounts change with breed, body weight, age, pregnancy, milk or egg yield, season and the quality of fodder available. Confirm a detailed feed plan with a livestock extension officer or veterinarian.', 'இவை சராசரி ஆரோக்கியமான வயது வந்த விலங்கிற்கான பொதுவான தினசரி அளவுகள். உண்மையான அளவு இனம், உடல் எடை, வயது, கர்ப்பம், பால்/முட்டை உற்பத்தி, பருவம் மற்றும் கிடைக்கும் தீவனத்தின் தரத்தைப் பொறுத்து மாறும். விரிவான தீவன திட்டத்திற்கு கால்நடை விரிவாக்க அதிகாரி அல்லது மருத்துவரிடம் உறுதி செய்யவும்.')}</div>
    </div>
    ${bottomNav('home')}`;
  }

  /* ---- Reminders ---- */
  function renderReminders(){
    const items = [];
    state.animals.forEach(a=>{
      (a.vaccinations||[]).forEach(v=>{
        const st = vaccStatus(v.nextDue);
        if(st!=='completed'){
          items.push({animal:a, v, st});
        }
      });
    });
    items.sort((x,y)=> new Date(x.v.nextDue)-new Date(y.v.nextDue));
    return `
    <div class="screen">
      ${topBar('Reminders','நினைவூட்டல்கள்')}
      ${items.length===0 ? emptyState('No upcoming reminders. Add vaccination records to see them here.', 'வரவிருக்கும் நினைவூட்டல்கள் இல்லை. தடுப்பூசி பதிவுகள் சேர்க்கவும்.') :
        items.map(it=>{
          const am = animalMeta(it.animal.type);
          return `<div class="list-item" style="cursor:default;">
            <div>
              <div style="font-weight:800;">${am.ic} ${it.animal.name||am.en}: ${it.v.name}</div>
              <div class="meta">${bi('Due','தேதி','1')}: ${fmtDate(it.v.nextDue)}</div>
            </div>
            <span class="status-badge ${it.st}">${it.st==='overdue'?'❌ Overdue':'⏳ Due soon'}</span>
          </div>`;
        }).join('')}
    </div>
    ${bottomNav('home')}`;
  }

  /* ---- Voice AI ---- */
  function renderVoiceAI(){
    const v = state.voice;
    return `
    <div class="screen">
      ${topBar('Voice AI','குரல் AI')}
      <div class="center">
        <button class="mic-btn ${v.listening?'listening':''}" id="voiceMicBtn">🎤</button>
        <div>${bi('Speak to FarmCare AI','FarmCare AI-யிடம் பேசுங்கள்')}</div>
      </div>
      ${v.transcript ? `<div class="card" style="margin-top:18px;"><div class="section-title">${bi('You said','நீங்கள் சொன்னது')}</div><p style="margin:0;">${v.transcript}</p></div>` : ''}
      ${v.reply ? `
        <div class="card">
          <div class="section-title">🤖 ${bi('FarmCare AI','FarmCare AI')}</div>
          <p style="font-size:14px;margin:0 0 6px 0;">${v.reply.en}</p>
          <p style="font-size:13px;color:var(--ink-soft);margin:0;">${v.reply.ta}</p>
          <button class="btn btn-ghost btn-sm" style="margin-top:10px;" id="listenBtn">🔊 ${bi('Listen','கேட்க','1')}</button>
        </div>
      ` : ''}
      <div class="card">
        <textarea id="voiceTypeInput" placeholder="Or type your question here / அல்லது இங்கே தட்டச்சு செய்யவும்"></textarea>
        <button class="btn btn-primary btn-sm" style="margin-top:8px;" id="voiceSendBtn">${bi('Ask','கேள்','1')}</button>
      </div>
    </div>
    ${bottomNav('voiceAI')}`;
  }

  function renderSettings(){
    return `
    <div class="screen">
      ${topBar('Settings','அமைப்புகள்')}
      <div class="card">
        <div class="section-title">${bi('Language','மொழி')}</div>
        <p class="small-muted">${bi('The app shows both English and Tamil together throughout.', 'இந்த ஆப் முழுவதும் ஆங்கிலம் மற்றும் தமிழ் இரண்டையும் ஒன்றாகக் காட்டுகிறது.')}</p>
      </div>
      <div class="card">
        <div class="section-title">${bi('About','பற்றி')}</div>
        <p class="small-muted">${bi('FarmCare AI helps with photo + voice health checks, first aid guidance, vaccination reminders, animal records and finding nearby veterinary help. It does not replace professional veterinary care.', 'FarmCare AI புகைப்படம் + குரல் மூலம் உடல்நல பரிசோதனை, முதலுதவி வழிகாட்டுதல், தடுப்பூசி நினைவூட்டல், விலங்கு பதிவுகள் மற்றும் அருகிலுள்ள கால்நடை மருத்துவ உதவியை கண்டுபிடிக்க உதவுகிறது. இது தொழில்முறை கால்நடை மருத்துவ சிகிச்சைக்கு மாற்றாக அமையாது.')}</p>
      </div>
      <button class="btn btn-emg" data-action="logout">${bi('Log Out','வெளியேறு','1')}</button>
    </div>
    ${bottomNav('settings')}`;
  }

  /* ---------------- Event handlers ---------------- */
  function attachHandlers(){
    document.querySelectorAll('[data-nav]').forEach(el=>{
      el.addEventListener('click', ()=> go(el.getAttribute('data-nav')));
    });
    document.querySelectorAll('[data-action]').forEach(el=>{
      el.addEventListener('click', (e)=> handleAction(el.getAttribute('data-action'), el, e));
    });

    const photoInput = document.getElementById('photoInput');
    if(photoInput) photoInput.addEventListener('change', (e)=> handlePhoto(e, (data)=>{ state.scan.photoData = data; render(); }));

    const newAnimalPhoto = document.getElementById('newAnimalPhoto');
    if(newAnimalPhoto) newAnimalPhoto.addEventListener('change', (e)=> handlePhoto(e, (data)=>{
      state._newAnimalPhoto = data;
      document.getElementById('newPhotoPreviewWrap').innerHTML = `<img class="photo-preview" src="${data}">`;
    }));

    const symptomsText = document.getElementById('symptomsText');
    if(symptomsText) symptomsText.addEventListener('input', (e)=> state.scan.symptomsText = e.target.value);

    const micScanBtn = document.getElementById('micScanBtn');
    if(micScanBtn) micScanBtn.addEventListener('click', ()=> startDictation((text)=>{
      state.scan.symptomsText = (state.scan.symptomsText? state.scan.symptomsText+' ' : '') + text;
      render();
    }));

    const voiceMicBtn = document.getElementById('voiceMicBtn');
    if(voiceMicBtn) voiceMicBtn.addEventListener('click', ()=>{
      startDictation((text)=>{
        state.voice.transcript = text;
        state.voice.reply = ruleBasedVoiceReply(text);
        render();
        speak(state.lang==='en' ? state.voice.reply.en : state.voice.reply.ta, speechLangCode());
      }, ()=>{ state.voice.listening = true; render(); }, ()=>{ state.voice.listening = false; render(); });
    });

    const voiceSendBtn = document.getElementById('voiceSendBtn');
    if(voiceSendBtn) voiceSendBtn.addEventListener('click', ()=>{
      const val = document.getElementById('voiceTypeInput').value.trim();
      if(!val) return;
      state.voice.transcript = val;
      state.voice.reply = ruleBasedVoiceReply(val);
      render();
    });

    const listenBtn = document.getElementById('listenBtn');
    if(listenBtn) listenBtn.addEventListener('click', ()=>{
      if(state.voice.reply) speak(state.lang==='en' ? state.voice.reply.en : (state.lang==='ta' ? state.voice.reply.ta : state.voice.reply.ta + '. ' + state.voice.reply.en), speechLangCode());
    });

    const locateBtn = document.getElementById('locateBtn');
    if(locateBtn) locateBtn.addEventListener('click', ()=>{
      const statusEl = document.getElementById('locateStatus');
      statusEl.innerHTML = bi('Getting location...', 'இருப்பிடம் பெறப்படுகிறது...','1');
      if(!navigator.geolocation){ statusEl.innerHTML = bi('Location not supported on this device.', 'இந்த சாதனத்தில் இருப்பிடம் ஆதரிக்கப்படவில்லை.','1'); return; }
      navigator.geolocation.getCurrentPosition(
        (pos)=>{ statusEl.innerHTML = `📍 ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)} — ${bi('showing sample nearby services below', 'கீழே மாதிரி அருகிலுள்ள சேவைகள் காட்டப்படுகின்றன','1')}`; },
        (err)=>{ statusEl.innerHTML = bi('Location permission denied or unavailable.', 'இருப்பிட அனுமதி மறுக்கப்பட்டது அல்லது கிடைக்கவில்லை.','1'); }
      );
    });

    const emgLocateBtn = document.getElementById('emgLocateBtn');
    if(emgLocateBtn) emgLocateBtn.addEventListener('click', ()=>{
      const statusEl = document.getElementById('emgStatus');
      statusEl.innerHTML = bi('Getting location...', 'இருப்பிடம் பெறப்படுகிறது...','1');
      if(!navigator.geolocation){ statusEl.innerHTML = bi('Location not supported on this device.', 'இந்த சாதனத்தில் இருப்பிடம் ஆதரிக்கப்படவில்லை.','1'); return; }
      navigator.geolocation.getCurrentPosition(
        (pos)=>{ statusEl.innerHTML = `📍 ${bi('Location found','இருப்பிடம் கண்டறியப்பட்டது','1')}: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`; },
        (err)=>{ statusEl.innerHTML = bi('Location permission denied or unavailable.', 'இருப்பிட அனுமதி மறுக்கப்பட்டது அல்லது கிடைக்கவில்லை.','1'); }
      );
    });

    const startShareBtn = document.getElementById('startShareBtn');
    if(startShareBtn) startShareBtn.addEventListener('click', ()=>{
      if(!navigator.geolocation){ state.liveShare.active = true; render(); return; }
      navigator.geolocation.getCurrentPosition(
        (pos)=>{
          state.liveShare.active = true;
          render();
          const el = document.getElementById('liveLocData');
          if(el) el.innerHTML = `${bi('Your location','உங்கள் இருப்பிடம')}: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}<br><span class="small-muted">${bi('Demo link — connect messaging/maps service to send a real live link.', 'மாதிரி இணைப்பு — உண்மையான நேரடி இணைப்பை அனுப்ப செய்தி/வரைபட சேவையை இணைக்கவும்.')}</span>`;
        },
        ()=>{ state.liveShare.active = true; render(); }
      );
    });
    const stopShareBtn = document.getElementById('stopShareBtn');
    if(stopShareBtn) stopShareBtn.addEventListener('click', ()=>{ state.liveShare = {active:false, vetName:null}; render(); });
  }

  function handlePhoto(e, cb){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=> cb(reader.result);
    reader.readAsDataURL(file);
  }

  function startDictation(onResult, onStart, onEnd){
    const rec = getRecognition(speechLangCode());
    if(!rec){
      alert('Voice input is not supported in this browser. Please type instead.\nகுரல் உள்ளீடு இந்த உலாவியில் ஆதரிக்கப்படவில்லை. தட்டச்சு செய்யவும்.');
      return;
    }
    if(onStart) onStart();
    rec.onresult = (e)=>{
      const text = e.results[0][0].transcript;
      if(onEnd) onEnd();
      onResult(text);
    };
    rec.onerror = ()=>{ if(onEnd) onEnd(); };
    rec.onend = ()=>{ if(onEnd) onEnd(); };
    try{ rec.start(); }catch(e){ if(onEnd) onEnd(); }
  }

  function handleAction(action, el){
    switch(action){
      case 'setLang':
        state.lang = el.getAttribute('data-lang');
        render();
        break;
      case 'sendOtp': {
        const mobile = document.getElementById('mobileInput').value.trim();
        if(!/^\d{10}$/.test(mobile)){
          state.auth.error = bi('Please enter a valid 10-digit mobile number.', 'சரியான 10 இலக்க மொபைல் எண்ணை உள்ளிடவும்.','1');
          render();
          break;
        }
        state.auth.mobile = mobile;
        state.auth.generatedOtp = (mobile === DEMO_CREDENTIALS.mobile) ? DEMO_CREDENTIALS.otp : String(Math.floor(1000+Math.random()*9000));
        state.auth.otp = '';
        state.auth.error = '';
        state.auth.step = 'otp';
        render();
        break;
      }
      case 'verifyOtp': {
        const otp = document.getElementById('otpInput').value.trim();
        if(otp === state.auth.generatedOtp){
          state.auth = { step:'mobile', mobile:'', otp:'', generatedOtp:'', error:'' };
          go('home');
        } else {
          state.auth.error = bi('Incorrect OTP. Please check the demo OTP shown below and try again.', 'தவறான OTP. கீழே உள்ள டெமோ OTP-ஐ சரிபார்த்து மீண்டும் முயற்சிக்கவும்.','1');
          render();
        }
        break;
      }
      case 'changeMobile':
        state.auth = { step:'mobile', mobile:'', otp:'', generatedOtp:'', error:'' };
        render();
        break;
      case 'guestLogin':
        state.auth = { step:'mobile', mobile:'', otp:'', generatedOtp:'', error:'' };
        go('home');
        break;
      case 'logout':
        state.auth = { step:'mobile', mobile:'', otp:'', generatedOtp:'', error:'' };
        go('login');
        break;
      case 'selectAnimalHome':
        state.scan.animalType = el.getAttribute('data-id');
        go('scan');
        break;
      case 'setScanAnimal':
        state.scan.animalType = el.getAttribute('data-id');
        render();
        break;
      case 'setFeedAnimal':
        state.animalTypeFilter = el.getAttribute('data-id');
        render();
        break;
      case 'setFirstAidAnimal':
        state.firstAid.animalType = el.getAttribute('data-id');
        state.firstAid.topicId = null;
        render();
        break;
      case 'setFirstAidTopic':
        state.firstAid.topicId = el.getAttribute('data-id');
        render();
        break;
      case 'setVaccGuideAnimal':
        state.vaccGuideAnimal = el.getAttribute('data-id');
        render();
        break;
      case 'runAnalysis':
        state.scan.symptomsText = document.getElementById('symptomsText') ? document.getElementById('symptomsText').value : state.scan.symptomsText;
        state.scan.result = analyzeScan();
        go('scanResult');
        break;
      case 'shareLoc':
        state.liveShare.vetName = el.getAttribute('data-vet');
        go('liveLocation');
        break;
      case 'openVaccinationPicker':
        render();
        break;
      case 'goVaccAnimal':
        state.selectedAnimalId = el.getAttribute('data-id');
        go('vaccinationAnimal');
        break;
      case 'fillVaccFromGuide': {
        const a = getAnimal(state.selectedAnimalId);
        if(!a) return;
        const guide = VACCINATION_GUIDE[a.type] || VACCINATION_GUIDE.cow;
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const v = guide.vaccines[idx];
        if(!v) return;
        document.getElementById('vaccName').value = v.name_en;
        document.getElementById('vaccVolume').value = v.dose_en;
        document.getElementById('vaccSeason').value = v.season_en;
        break;
      }
      case 'addVaccination': {
        const a = getAnimal(state.selectedAnimalId);
        if(!a) return;
        const name = document.getElementById('vaccName').value.trim();
        const volume = document.getElementById('vaccVolume').value.trim();
        const season = document.getElementById('vaccSeason').value.trim();
        const dateGiven = document.getElementById('vaccDate').value;
        const nextDue = document.getElementById('vaccNext').value;
        if(!name || !nextDue){ alert('Please enter vaccine name and next due date.\nதடுப்பூசி பெயர் மற்றும் அடுத்த தேதியை உள்ளிடவும்.'); return; }
        a.vaccinations = a.vaccinations || [];
        a.vaccinations.push({id:uid('vac'), name, volume, season, dateGiven, nextDue});
        saveAnimal(a).then(render);
        break;
      }
      case 'goRecordDetail':
        state.selectedAnimalId = el.getAttribute('data-id');
        go('recordDetail');
        break;
      case 'saveNewAnimal': {
        const name = document.getElementById('raName').value.trim();
        const breed = document.getElementById('raBreed').value.trim();
        const sex = document.getElementById('raSex').value;
        const age = document.getElementById('raAge').value;
        const weight = document.getElementById('raWeight').value;
        const notes = document.getElementById('raNotes').value.trim();
        const animal = {
          id: uid('a'),
          type: state.scan.animalType,
          name, breed, sex, age, weight, notes,
          photoData: state._newAnimalPhoto || null,
          vaccinations: [],
          createdAt: Date.now(),
        };
        state.animals.unshift(animal);
        state._newAnimalPhoto = null;
        saveAnimal(animal).then(()=> go('recordDetail', {selectedAnimalId: animal.id}));
        break;
      }
      case 'deleteAnimalConfirm': {
        const id = el.getAttribute('data-id');
        if(confirm('Delete this animal record? / இந்த பதிவை நீக்கவா?')){
          deleteAnimal(id).then(()=> go('records'));
        }
        break;
      }
    }
  }

  /* ---------------- Init ---------------- */
  loadAnimals().finally(()=>{
    render();
    setTimeout(()=>{
      if(state.page === 'splash'){ go('login'); }
    }, 1800);
  });
})();
</script>
